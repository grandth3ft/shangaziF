<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta -->
    <title>Shangazi Foundation — Giving Children a Chance to Thrive</title>
    <meta name="description" content="Shangazi Foundation supports vulnerable children in Kenya through education, healthcare, feeding programs, shelter and mentorship. Donate via M-Pesa today." />
    <meta name="keywords" content="donate Kenya, children charity Kenya, M-Pesa donation, Shangazi Foundation, education Kenya, child welfare" />
    <meta name="author" content="Shangazi Foundation" />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#1A3A2A" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Shangazi Foundation" />
    <meta property="og:title"       content="Shangazi Foundation — Giving Children a Chance to Thrive" />
    <meta property="og:description" content="Supporting vulnerable children in Kenya through education, healthcare, and love. Donate via M-Pesa today." />
    <meta property="og:url"         content="https://shangazifoundation.org" />
    <meta property="og:locale"      content="en_KE" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Shangazi Foundation" />
    <meta name="twitter:description" content="Donate to support vulnerable children in Kenya. Simple M-Pesa payment." />

    <!-- Favicon -->
    <link rel="icon"             type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180"      href="/favicon.svg" />

    <!-- Preconnect to fonts origin (critical for LCP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Font load — display=swap prevents FOIT, subset for performance -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap&subset=latin"
      rel="stylesheet"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://shangazifoundation.org" />
  </head>
  <body class="antialiased">

    <noscript>

        Please enable JavaScript in your browser settings.
      </div>
    </noscript>

    <div id="root"></div>
